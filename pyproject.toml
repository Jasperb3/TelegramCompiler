[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "the-daily-telegram"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "telethon>=1.36",
    "openai>=1.30",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "markdown-pdf>=1.3",
    "python-dotenv>=1.0",
    "pypdf>=4.0",
    "tqdm>=4.66",
    "lmstudio>=1.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.6"]
inspect = [
    "datasette>=0.65",
    "datasette-media>=0.5.1",
    "datasette-json-html>=1.0.1",
    "datasette-pretty-json>=0.3",
    "datasette-vega>=0.6.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
# Import hygiene and unused-code discipline only (per audit F8.4) — line-length/style
# rules are deliberately excluded to avoid a repo-wide reformatting sweep.
select = ["F", "I"]
